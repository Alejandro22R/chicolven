<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chicolven · Pantallas</title>
<link rel="icon" href="/player/logo.svg">
<style>
  body { margin: 0; background: #0A0A0A; color: #fff; font-family: Arial, Helvetica, sans-serif; padding: 24px; }
  img { height: 64px; }
  h1 { font-size: 22px; color: #8DC63F; }
  a { display: block; margin: 12px 0; padding: 18px 22px; background: #D7191C; color: #fff; text-decoration: none;
      font-size: 22px; font-weight: bold; border-radius: 10px; max-width: 520px; }
  a span { display: block; font-size: 14px; font-weight: normal; opacity: .85; }
  p { color: #bbb; }
</style>
</head>
<body>
<img src="/player/logo.svg" alt="Chicolven">
<h1>Elija la pantalla para este televisor</h1>
<div id="list"><p>Cargando…</p></div>
<p>Consejo: abra el enlace y ponga el navegador en pantalla completa (F11) o en modo kiosko.</p>
<script>
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/api/public/screens');
  xhr.onload = function () {
    var list = document.getElementById('list');
    var screens = [];
    try { screens = JSON.parse(xhr.responseText); } catch (e) {}
    if (!screens.length) { list.innerHTML = '<p>No hay pantallas activas. Créelas en el panel de administración.</p>'; return; }
    list.innerHTML = '';
    for (var i = 0; i < screens.length; i++) {
      var a = document.createElement('a');
      a.href = '/tv/' + screens[i].id;
      a.textContent = screens[i].name;
      var s = document.createElement('span');
      s.textContent = 'http://' + location.host + '/tv/' + screens[i].id;
      a.appendChild(s);
      list.appendChild(a);
    }
  };
  xhr.send();
</script>
</body>
</html>
